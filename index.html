<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="fonts/style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container header__container">
            <div class="header__left">
                <img src="images/logo/logo-riot.svg" alt="logo riot" class="header__left-logo">
                <img src="images/logo/logo-light.svg" alt="" class="header__left-logo--light">
            </div>
            <nav class="nav">
                <a href="#" class="nav__link">GAME</a>
                <a href="#" class="nav__link">CHAMPIONS</a>
                <a href="#" class="nav__link">NEWS</a>
                <a href="#" class="nav__link">PATCH NOTES</a>
                <a href="#" class="nav__link">DISCOVER</a>
                <a href="#" class="nav__link">ESPORTS</a>
                <a href="#" class="nav__link">UNIVERSE</a>
                <a href="#" class="nav__link">SHOP</a>
                <a href="#" class="nav__link">SUPPORT</a>
            </nav>

            <div class="header__right">
                <img src="images/ava.jpg" class="header__right-logo">
                <p class="header__right-text">UNEPICKID</p>
            </div>
        </div>
    </header>
    <main>
        <section class="hero-section">
            <div class="container">
                <div class="hero">
                    <div class="hero__left">
                        <h1 class="hero__left__title">AGENTS</h1>
                        <img src="images/logo/logo.svg" alt="" class="hero__left__logo">
                    </div>
                    <div class="cards">
                        <div class="card">
                            <h3 class="card__country">United Kingdom</h3>
                            <h3 class="card__name">PHOENIX</h3>
                            <img src="images/characters/phoenix/character.png" alt="" class="card__image">
                            <div class="card__abilities">
                                <img src="images/characters/phoenix/ability1.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability2.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability3.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability4.svg" alt="" class="card__abilities-img">
                            </div>
                        </div>
                        <div class="card">
                            <h3 class="card__country">United Kingdom</h3>
                            <h3 class="card__name">PHOENIX</h3>
                            <img src="images/characters/phoenix/character.png" alt="" class="card__image">
                            <div class="card__abilities">
                                <img src="images/characters/phoenix/ability1.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability2.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability3.svg" alt="" class="card__abilities-img">
                                <img src="images/characters/phoenix/ability4.svg" alt="" class="card__abilities-img">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
